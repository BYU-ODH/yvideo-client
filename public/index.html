<!DOCTYPE html>

<head>
	<meta charset='utf-8'>
	<link rel='shortcut icon' href='%PUBLIC_URL%/favicon.ico'>

	<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
	<!--
	OneTrust cookie consent is disabled because it breaks YouTube playback.

	OtAutoBlock.js blocks tags listed under consent categories the user has not accepted.
	BYU's shared block list (domain script 6985a5b2-0d75-4cac-8d42-8564ff47121f) categorises
	both https://www.youtube.com/iframe_api and https://www.youtube.com/embed/ as C0004
	(targeting cookies), and the site grants only C0001 by default. The result: the iframe
	API script is rewritten to type="text/plain" so it never executes, and the embed iframe
	has its src moved to data-src, so no YouTube video can ever play. It fails silently,
	with no error the player can report.

	Re-enabling this requires the YouTube entries to be categorised as strictly necessary
	(C0001). That cannot be scoped to one hostname within a shared block list, so it needs a
	OneTrust domain script ID specific to yvideo.byu.edu. Once that exists, restore the block
	below and swap both occurrences of the domain script ID.

	<script type='text/javascript' src='https://cdn.cookielaw.org/consent/6985a5b2-0d75-4cac-8d42-8564ff47121f/OtAutoBlock.js' ></script>

	<script>
	(function() { // Scoping function to avoid globals
    	(document.URL.indexOf('localhost') === -1) &&
    	document.write(`<script src='https://cdn.cookielaw.org/scripttemplates/otSDKStub.js' type='text/javascript' charset='UTF-8' data-domain-script='6985a5b2-0d75-4cac-8d42-8564ff47121f' ><\/script>
		<script type='text/javascript'>
			function OptanonWrapper() { }
		<\/script>`)
	})();
	</script>
	-->




	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.1.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/fontawesome.min.css">
	<style>
		@import url('https://fonts.googleapis.com/css?family=Roboto+Mono|Roboto:300,400,500');

		::-webkit-scrollbar {
			display: none;
		}

		:root {
			font-family: 'Roboto';
			font-size: 12px;
			line-height: 10px;

			/* CSS Variables */

			--navbar-height: 6rem;

			--navy-blue: #002e5d;
			--royal-blue: #0057b8;
			--light-blue: #0582ca;
			--light-yellow: #ffcd38;
			--yellow: #ffbf00;
			--dark-yellow: #daa300;
			--red: #ff4c4c;
			--dark-red: #b80000;

		}

		* {
			margin: 0;
			-ms-overflow-style: none;
			scrollbar-width: none;
		}

		/* ::-webkit-scrollbar {
			display: none;
		} */

		body {
			font-size: 1.2rem;
			line-height: 1.4rem;
			overflow-y: scroll;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		#load {
			transition: opacity .25s ease-in-out;
		}

		.std-outline-color {
			outline-color: var(--light-blue);
		}
	</style>

	<link rel='manifest' href='%PUBLIC_URL%/manifest.json'>

	<title>Y-Video</title>
</head>

<body>
